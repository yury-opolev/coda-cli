[workspace]
resolver = "3"
members = [
    "crates/coda-proto",
    "crates/coda-client",
    "crates/coda-llm",
    "crates/coda-render",
    "crates/coda-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"
repository = "https://github.com/yury-opolev/coda-cli"

[workspace.dependencies]
coda-proto = { path = "crates/coda-proto" }
coda-client = { path = "crates/coda-client" }
coda-llm = { path = "crates/coda-llm" }
coda-render = { path = "crates/coda-render" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "sync",
    "time",
    "fs",
    "signal",
] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
bytes = "1"

ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

unicode-width = "0.2"
unicode-segmentation = "1"
textwrap = "0.16"
pulldown-cmark = { version = "0.13", default-features = false }

clap = { version = "4", features = ["derive", "env"] }
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
arboard = "3"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
once_cell = "1"

insta = { version = "1", features = ["yaml"] }
pretty_assertions = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
