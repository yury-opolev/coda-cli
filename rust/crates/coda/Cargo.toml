[package]
name = "coda"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Coda — an agentic coding assistant"

[[bin]]
name = "coda"
path = "src/main.rs"

[dependencies]
coda-tui = { workspace = true }
coda-serve = { workspace = true }
coda-client = { workspace = true }
coda-proto = { workspace = true }
coda-render = { workspace = true }
coda-auth = { workspace = true }
coda-diagnostics = { workspace = true }
coda-boot = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3"
# The launch preflight is a screen: `tui_client` drives it against a test
# backend with scripted keys, so the terminal toolkit is a test dependency
# here for the same reason it is a real one in `coda-tui`.
ratatui = { workspace = true }
crossterm = { workspace = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "macros"] }

