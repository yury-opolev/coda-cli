[package]
name = "coda-serve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
coda-proto = { workspace = true }
coda-agent = { workspace = true }
coda-tool = { workspace = true }
coda-mcp = { workspace = true }
coda-llm = { workspace = true }
coda-auth = { workspace = true }
coda-diagnostics = { workspace = true }

tokio = { workspace = true, features = ["io-std"] }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time"] }
tempfile = "3"
coda-mcp = { workspace = true, features = ["test-support"] }
# Test-only: the engine reads `settings.json`, the auth service writes the two
# keys it owns through `coda_boot::settings_store`. One test drives both sides
# over the same file to prove they agree; nothing in the engine's shipped code
# depends on the bootstrap crate.
coda-boot = { workspace = true }
