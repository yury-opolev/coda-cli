[package]
name = "coda-serve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
coda-proto = { workspace = true }
coda-agent = { workspace = true }
coda-tool = { workspace = true }
coda-mcp = { workspace = true }
coda-llm = { workspace = true }
coda-auth = { workspace = true }
coda-diagnostics = { workspace = true }
# The product version stamped into planned-restart files.
coda-boot = { workspace = true }

tokio = { workspace = true, features = ["io-std"] }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
# Plugin approval keys (plugin-trust.json) and receipt content hashes.
sha2 = "0.10"
# `coda plugin` subcommand definitions.
clap = { workspace = true }
# `catch_unwind` on the dispatch future: a panicking handler must still answer
# its caller rather than leaving the request pending forever. See
# `transport::guard_panics`.
futures = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }
tempfile = "3"
coda-mcp = { workspace = true, features = ["test-support"] }
