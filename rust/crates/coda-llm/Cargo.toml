[package]
name = "coda-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Provider clients and the neutral chat model for the Coda engine."

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
bytes.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
futures-util = { version = "0.3", default-features = false }
async-stream = "0.3"
async-trait = "0.1"

[dev-dependencies]
pretty_assertions.workspace = true
tokio = { workspace = true, features = ["net", "macros", "rt-multi-thread", "io-util", "time"] }
