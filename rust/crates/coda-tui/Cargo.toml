[package]
name = "coda-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Coda terminal user interface."

[[bin]]
name = "coda-tui"
path = "src/main.rs"

[dependencies]
coda-proto.workspace = true
coda-client.workspace = true
coda-render.workspace = true
# JSON *parsing* only, scoped to `src/local/` (the local maintenance adapter)
# by `tests/conventions.rs`. The MCP editor has to show what is written in
# `.mcp.json`, including the unresolved `coda-secret:` references the engine
# deliberately never returns, so one crate owns that file format rather than
# the TUI growing a second parser for it. Nothing here executes a server.
coda-mcp.workspace = true
coda-auth.workspace = true
coda-diagnostics.workspace = true
coda-boot.workspace = true
futures.workspace = true
futures-lite = "2"
async-trait.workspace = true

anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
ratatui.workspace = true
crossterm.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
clap.workspace = true
directories.workspace = true
tracing.workspace = true
arboard.workspace = true
png.workspace = true
chrono.workspace = true
time.workspace = true
uuid.workspace = true

[dev-dependencies]
insta.workspace = true
pretty_assertions.workspace = true
tempfile = "3"
coda-llm.workspace = true
# Test fixtures only: `tests/` writes saved transcripts through
# `SessionTranscriptStore::save` so the engine has something real to list and
# resume. It is deliberately **not** a `[dependencies]` entry — that is the
# assertion in `tests/conventions.rs`, and it is what guarantees the shipped
# terminal front-end contains no in-process agent execution path.
coda-agent.workspace = true

